name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Verificar anonimização dos dados demo
        run: npm run demo:verificar

      - name: Criar .env.production
        run: |
          echo "VITE_DATA_MODE=${{ secrets.VITE_DATA_MODE }}" >> .env.production
          echo "VITE_SHEETS_API_KEY=${{ secrets.SHEETS_API_KEY }}" >> .env.production
          echo "VITE_SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}" >> .env.production
          echo "VITE_SHEETS_RANGE=${{ secrets.SHEETS_RANGE || 'transacoes' }}" >> .env.production
          echo "VITE_REFERENCE_RANGE=${{ secrets.REFERENCE_RANGE || 'referencia_servicos' }}" >> .env.production
          echo "VITE_APPS_SCRIPT_URL=${{ secrets.APPS_SCRIPT_URL }}" >> .env.production
          echo "VITE_BASE_URL=${{ secrets.VITE_BASE_URL || format('/{0}/', github.event.repository.name) }}" >> .env.production

      - name: Build do Vue
        run: npm run build

      - name: Deploy para GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          force: true
